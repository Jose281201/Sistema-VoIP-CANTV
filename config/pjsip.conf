[global]
type=global
endpoint_identifier_order=auth_username,username,ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Plantillas ---
[plantilla-endpoint](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[plantilla-auth](!)
type=auth
auth_type=userpass

[plantilla-aor](!)
type=aor
max_contacts=1
remove_existing=yes

; --- Extensión 1001 (Celular) ---
[1001](plantilla-endpoint)
auth=1001
aors=1001

[1001](plantilla-auth)
username=1001
password=1234

[1001](plantilla-aor)

; --- Extensión 1002 (PC) ---
[1002](plantilla-endpoint)
auth=1002
aors=1002

[1002](plantilla-auth)
username=1002
password=1234

[1002](plantilla-aor)