[from-internal]
; ============================================================
;  CENTRAL CANTV - Plan de marcado
;  Facturacion automatica por segundo  +  IVR *100
;  La tarifa se define desde el panel web (configuracion -> tarifa_seg)
; ============================================================

; ============================================================
; 1) LLAMADAS ENTRE EXTENSIONES (10XX) CON COBRO AUTOMATICO
; ============================================================
exten => _10XX,1,NoOp(=== Llamada de [${CALLERID(num)}] hacia [${EXTEN}] ===)
same => n,Set(ABONADO=${CALLERID(num)})
same => n,Set(BILLABLE=0)
; Si la llamada no trae CallerID no se puede facturar: se deja pasar sin cobro
same => n,GotoIf($["${ABONADO}" = ""]?sin_id)

; --- 1.1) Esta bloqueado? (deuda marcada o saldo en 0) ---
same => n,Set(ESTADO=${CURL(http://127.0.0.1:5000/api/check/${ABONADO})})
same => n,NoOp(Estado del abonado [${ABONADO}]: [${ESTADO}])
same => n,GotoIf($["${ESTADO}" =~ "deudor"]?bloqueo)

; --- 1.2) Cuantos segundos le alcanzan segun su saldo ---
same => n,Set(MAXSEG=${CURL(http://127.0.0.1:5000/api/maxtime/${ABONADO})})
same => n,NoOp(Tiempo maximo autorizado: [${MAXSEG}] segundos)
; Si el panel no responde, se usa un tope de seguridad de 10 minutos
same => n,GotoIf($["${MAXSEG}" != ""]?revisar)
same => n,Set(MAXSEG=600)
same => n(revisar),GotoIf($["${MAXSEG}" =~ "bloqueado"]?bloqueo)
; El limite de Dial se expresa en milisegundos
same => n,Set(MAXMS=${MATH(${MAXSEG}*1000,int)})
same => n,GotoIf($["${MAXMS}" != ""]?fijado)
same => n,Set(MAXMS=600000)
same => n(fijado),NoOp(La llamada se cortara a los [${MAXMS}] ms)

; --- 1.3) Grabacion + llamada (se corta sola al agotarse el saldo) ---
same => n,Set(BILLABLE=1)
same => n,Set(MONITOR_FILENAME=${UNIQUEID}.wav)
same => n,MixMonitor(/var/spool/asterisk/monitor/${MONITOR_FILENAME})
same => n,Set(CDR(recordingfile)=${MONITOR_FILENAME})
same => n,Dial(PJSIP/${EXTEN},25,L(${MAXMS}))
same => n,GotoIf($["${ANSWEREDTIME}" != ""]?tiene_tiempo)
same => n,Set(SEGUNDOS=0)
same => n,Goto(cobrar)
same => n(tiene_tiempo),Set(SEGUNDOS=${ANSWEREDTIME})
same => n,NoOp(Llamada terminada | contestados: [${SEGUNDOS}] s | estado: [${DIALSTATUS}])

; --- 1.4) Cobro por segundo (lo hace el panel sobre el saldo) ---
same => n(cobrar),Set(SALDOFINAL=${CURL(http://127.0.0.1:5000/api/charge/${ABONADO}/${SEGUNDOS})})
same => n,NoOp(Saldo de [${ABONADO}] despues del cobro: [${SALDOFINAL}])
same => n,GotoIf($["${SALDOFINAL}" != ""]?cobrado)
; Si el panel no confirmo el cobro, no se marca como cobrado: lo reintenta la extension h
same => n,NoOp(El cobro no se pudo confirmar ahora; se intentara de nuevo al colgar)
same => n,Goto(fin)
same => n(cobrado),Set(BILLABLE=0)
same => n,GotoIf($["${SALDOFINAL}" =~ "deudor"]?agotado)
same => n,Goto(fin)

; --- 1.5) Mensajes de salida ---
same => n(bloqueo),Set(BILLABLE=0)
same => n,NoOp(Abonado [${ABONADO}] bloqueado: se reproduce el aviso de pago)
same => n,Playback(es/custom/pague_su_deuda)
same => n,Hangup()

same => n(agotado),NoOp(Abonado [${ABONADO}] se quedo sin saldo: se reproduce el aviso de pago)
same => n,Playback(es/custom/pague_su_deuda)
same => n,Hangup()

; --- 1.6) Llamada sin CallerID: pasa pero no se cobra ---
same => n(sin_id),NoOp(Aviso: la llamada no trae CallerID, no se puede facturar)
same => n,Set(MONITOR_FILENAME=${UNIQUEID}.wav)
same => n,MixMonitor(/var/spool/asterisk/monitor/${MONITOR_FILENAME})
same => n,Set(CDR(recordingfile)=${MONITOR_FILENAME})
same => n,Dial(PJSIP/${EXTEN},25)
same => n(fin),Hangup()

; ============================================================
; 1.7) EXTENSION h: COBRO DE RESPALDO SI EL QUE LLAMA CUELGA
;      (si el que llama cuelga, el plan de marcado no sigue:
;       el cobro se hace aqui, con los segundos contestados)
; ============================================================
exten => h,1,NoOp(Fin de llamada [${ABONADO}] | facturable=[${BILLABLE}] | contestados=[${ANSWEREDTIME}] | billsec=[${CDR(billsec)}])
same => n,GotoIf($["${BILLABLE}" = "1"]?cobrar)
same => n,Hangup()
same => n(cobrar),GotoIf($["${ANSWEREDTIME}" != ""]?con_tiempo)
same => n,Set(SEGUNDOS=${CDR(billsec)})
same => n,Goto(enviar)
same => n(con_tiempo),Set(SEGUNDOS=${ANSWEREDTIME})
same => n(enviar),Set(BILLABLE=0)
same => n,GotoIf($["${SEGUNDOS}" != ""]?cobrar_ahora)
same => n,Set(SEGUNDOS=0)
same => n(cobrar_ahora),Set(RES=${CURL(http://127.0.0.1:5000/api/charge/${ABONADO}/${SEGUNDOS})})
same => n,NoOp(Cobro al colgar: [${ABONADO}] ${SEGUNDOS} s -> saldo [${RES}])
same => n,Hangup()


; ============================================================
; 2) IVR *100 - CONSULTA DE SALDO Y SOPORTE TECNICO
; ============================================================
exten => *100,1,Answer()
same => n,Set(CHANNEL(language)=es)
same => n(menu),Background(es/custom/bienvenida_cantv)
same => n,WaitExten(5)
; Si no marca nada, vuelve al menu
same => n,Goto(menu)

; --- Opcion 1: consultar saldo exacto ---
exten => 1,1,Set(CALLER_ID=${CALLERID(num)})
same => n,NoOp(Consulta de saldo para [${CALLER_ID}])
same => n,Set(SALDO_STR=${CURL(http://127.0.0.1:5000/api/balance/${CALLER_ID})})
same => n,NoOp(Saldo recibido del panel: [${SALDO_STR}])
; Si el panel no responde, se avisa y se cuelga
same => n,GotoIf($["${SALDO_STR}" != ""]?leer)
same => n,Playback(please-try-again)
same => n,Hangup()
; Se separa "enteros" de "centimos" (el panel devuelve 5,50 por ejemplo)
same => n(leer),Set(SALDO_ENT=${CUT(SALDO_STR,\,,1)})
same => n,Set(SALDO_DEC=${CUT(SALDO_STR,\,,2)})
same => n,Playback(es/custom/su_saldo_es)
same => n,SayNumber(${SALDO_ENT})
same => n,Playback(es/custom/bolivares)
same => n,Playback(es/custom/con)
same => n,SayNumber(${SALDO_DEC})
same => n,Playback(es/custom/centimos)
; Al terminar de decir el saldo, se corta la llamada
same => n,Hangup()

; --- Opcion 2: soporte tecnico dinamico (el numero se cambia desde el panel) ---
exten => 2,1,Playback(es/custom/transfiriendo)
; El panel devuelve solo digitos, sin espacios ni saltos de linea
same => n,Set(TECNICO_EXT=${CURL(http://127.0.0.1:5000/api/tecnico)})
same => n,NoOp(Tecnico configurado en el panel: [${TECNICO_EXT}])
; Si el panel no responde, se usa el 1002 por defecto
same => n,GotoIf($["${TECNICO_EXT}" != ""]?marcar)
same => n,Set(TECNICO_EXT=1002)
same => n(marcar),NoOp(Marcando al tecnico: [PJSIP/${TECNICO_EXT}])
same => n,Dial(PJSIP/${TECNICO_EXT},20)
; Se cuelga siempre: nunca se vuelve al menu (asi se evita el bucle)
same => n,NoOp(Resultado de la llamada al tecnico: [${DIALSTATUS}])
same => n,Hangup()

; --- Opciones invalidas o timeout ---
exten => i,1,Playback(pbx-invalid)
same => n,Goto(*100,menu)

exten => t,1,Playback(please-try-again)
same => n,Goto(*100,menu)